defaults: 
  - dataset: dataset 
  - models: model
  - optim: adamw_cosine
  - _self_

seed: 42
device: cuda:0

output_dir: outputs_stage3

window_size: 16
local_w: 16
batch_size: 64
action_horizon: 16
add_latent_action: true

tasks_num: 5
balance_tasks: false

train:
  epochs: 60
  grad_accum_steps: 1
  grad_clip_norm: 1.0
  iters_per_epoch: 0
  log_interval: 10
  ckpt_interval: 5 
  skip_epochs: 35

wandb:
  enable: false
  project: "MOTIF-stage3"
  name: "${now:%Y-%m-%d}/${now:%H-%M-%S}"
  tags: ["stage3", "test"]
  notes: null
  offline: false
  log_code: true
  watch: false
  watch_log: "gradients"
  watch_freq: 10
  log_ckpt: false

hydra:
  run:
    # dir: ${output_dir}/${now:%Y-%m-%d}/${now:%H-%M-%S}
    dir: ${output_dir}
  output_subdir: null 
