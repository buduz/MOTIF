defaults: 
  - dataset: dataset 
  - models: model
  - optim: adamw_cosine
  - _self_

seed: 42
device: cuda:0

output_dir: outputs_stage2

window_size: 32
local_w: 16
batch_size: 128
add_latent_action: true

tasks_num: 5
balance_tasks: true

train:
  epochs: 30
  grad_accum_steps: 1
  grad_clip_norm: 1.0
  iters_per_epoch: 0
  log_interval: 1
  ckpt_interval: 15 

wandb:
  enable: false
  project: "MOTIF-stage2"
  name: "${now:%Y-%m-%d}/${now:%H-%M-%S}"
  tags: ["stage2"]
  notes: null
  offline: false
  log_code: true
  watch: false
  watch_log: "gradients"
  watch_freq: 10
  log_ckpt: false

hydra:
  run:
    # dir: ${output_dir}/${now:%Y-%m-%d}/${now:%H-%M-%S}
    dir: ${output_dir}
  output_subdir: null 
